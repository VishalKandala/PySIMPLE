[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PySIMPLE"
version = "0.1.0"
description = "PySIMPLE: a backend-portable SIMPLE solver for two-dimensional Cartesian flows"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
viz = ["matplotlib>=3.7"]

[project.scripts]
pysimple = "pysimple.__main__:main"

[tool.setuptools.packages.find]
include = ["pysimple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
